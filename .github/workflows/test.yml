name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # first mago call downloads its binary

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          ini-values:  zend.assertions=1,  assert.exception=1
          coverage: ${{ matrix.php-versions == '8.5' && 'pcov' || 'none' }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint (mago)
        run: vendor/bin/mago lint

      - name: Check formatting (mago)
        run: vendor/bin/mago fmt --check

      - name: Static analysis (mago)
        run: vendor/bin/mago analyze

      - name: Run unit tests
        run: |
          if [ "${{ matrix.php-versions }}" = "8.5" ]; then
            vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text=coverage.txt
            cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          else
            vendor/bin/phpunit
          fi

      - name: Upload coverage
        if: matrix.php-versions == '8.5'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.txt

      - name: Upload to Codecov
        if: matrix.php-versions == '8.5'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Run doc tests
        run: vendor/bin/doctest src/ examples/
